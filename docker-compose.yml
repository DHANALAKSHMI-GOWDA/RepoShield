services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reposhield-backend
    ports:
      - "8000:8000"
    volumes:
      - reposhield_data:/app/data

  frontend:
    image: nginx:alpine
    container_name: reposhield-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  reposhield_data: